version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DATABASE_URL=sqlite+aiosqlite:///./data/trading_platform.db
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      - ./data:/app/data
      - ./dataset:/app/dataset
    restart: unless-stopped