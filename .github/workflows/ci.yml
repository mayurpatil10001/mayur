name: CI — Lint, Type-Check & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 ruff

      - name: Copy .env.example to .env (for CI environment)
        run: cp .env.example .env

      - name: Lint with ruff
        run: |
          ruff check trading_platform/ scripts/ --ignore E501,W503

      - name: Lint with flake8 (secondary)
        run: |
          flake8 trading_platform/ scripts/ --max-line-length=130 --extend-ignore=E501,W503,E722

      - name: Run unit & integration tests
        run: |
          pytest tests/ \
            --ignore=tests/old_unused_tests/ \
            --ignore=tests/ui/ \
            --ignore=tests/frontend_integration/ \
            -v --tb=short \
            --cov=trading_platform \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -x

      - name: Run out-of-sample audit (CI validation)
        run: |
          python scripts/run_out_of_sample_audit.py

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
